<svg xmlns="http://www.w3.org/2000/svg" width="3800" height="1200" viewBox="0 0 3800 1200"><title>Splatypus workflow: optional undistortion followed by optional alignment</title><desc>The original dataset may be overwritten with an undistorted dataset. The resulting original or undistorted dataset may then be aligned before preparing the Brush training dataset.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a8ca1"/></marker></defs><rect width="3800" height="1200" fill="#f7f9fc"/><g font-family="Segoe UI, Arial, sans-serif">
<text x="60" y="82" font-size="52" fill="#142b46" font-weight="600">Splatypus workflow</text>
<text x="60" y="129" font-size="28" fill="#43546b" font-weight="400">Photos or video → camera reconstruction → Gaussian splat training → Rhino preview</text>
<text x="60" y="201" font-size="24" fill="#3877a6" font-weight="600">01</text>
<text x="103" y="201" font-size="28" fill="#263e59" font-weight="600">Setup</text>
<path d="M60 220 H300" stroke="#d5dfe9" stroke-width="2"/>
<text x="340" y="201" font-size="24" fill="#3877a6" font-weight="600">02</text>
<text x="383" y="201" font-size="28" fill="#263e59" font-weight="600">Images</text>
<path d="M340 220 H610" stroke="#d5dfe9" stroke-width="2"/>
<text x="650" y="201" font-size="24" fill="#3877a6" font-weight="600">03</text>
<text x="693" y="201" font-size="28" fill="#263e59" font-weight="600">Reconstruct</text>
<path d="M650 220 H990" stroke="#d5dfe9" stroke-width="2"/>
<text x="1050" y="201" font-size="24" fill="#3877a6" font-weight="600">04</text>
<text x="1093" y="201" font-size="28" fill="#263e59" font-weight="600">Prepare dataset · two optional steps</text>
<path d="M1050 220 H2700" stroke="#d5dfe9" stroke-width="2"/>
<text x="2760" y="201" font-size="24" fill="#3877a6" font-weight="600">05</text>
<text x="2803" y="201" font-size="28" fill="#263e59" font-weight="600">Train</text>
<path d="M2760 220 H3110" stroke="#d5dfe9" stroke-width="2"/>
<text x="3250" y="201" font-size="24" fill="#3877a6" font-weight="600">06</text>
<text x="3293" y="201" font-size="28" fill="#263e59" font-weight="600">Preview</text>
<path d="M3250 220 H3730" stroke="#d5dfe9" stroke-width="2"/>
<path d="M300 550 H340" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M610 550 H650" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M990 550 H1050" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M1290 550 H1330" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M1530 550 H1610" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M1430 635 V760" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M1610 854 H1755 V650" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M1920 550 H1970" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M2170 550 H2430" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M2070 635 V760" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M2320 854 H2360 V550" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M2700 550 H2760" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M3110 550 H3250" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M3110 550 H3180 V823 H3250" fill="none" stroke="#7a8ca1" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<path d="M820 660 V815" fill="none" stroke="#7a8ca1" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="60" y="470" width="240" height="165" rx="15" fill="#ffffff" stroke="#d4dfeb" stroke-width="2"/>
<text x="82" y="510" font-size="28" fill="#142b46" font-weight="600">Project setup</text>
<text x="82" y="550" font-size="24" fill="#43546b" font-weight="400">Create project</text>
<text x="82" y="584" font-size="24" fill="#43546b" font-weight="400">Locate / download</text>
<text x="82" y="618" font-size="24" fill="#43546b" font-weight="400">required tools</text>
<rect x="340" y="470" width="270" height="165" rx="15" fill="#ffffff" stroke="#d4dfeb" stroke-width="2"/>
<text x="362" y="510" font-size="28" fill="#142b46" font-weight="600">Media import</text>
<text x="362" y="550" font-size="24" fill="#43546b" font-weight="400">Photos or video</text>
<text x="362" y="584" font-size="24" fill="#43546b" font-weight="400">FFmpeg prepares</text>
<text x="362" y="618" font-size="24" fill="#43546b" font-weight="400">the image set</text>
<rect x="650" y="435" width="340" height="225" rx="15" fill="#eaf2fa" stroke="#c1d7e9" stroke-width="2"/>
<text x="672" y="475" font-size="28" fill="#142b46" font-weight="600">COLMAP</text>
<text x="672" y="515" font-size="24" fill="#43546b" font-weight="400">1. Extract features</text>
<text x="672" y="549" font-size="24" fill="#43546b" font-weight="400">2. Match across images</text>
<text x="672" y="583" font-size="24" fill="#43546b" font-weight="400">3. Reconstruct cameras</text>
<text x="672" y="617" font-size="24" fill="#43546b" font-weight="400">    and sparse 3D points</text>
<rect x="650" y="815" width="340" height="130" rx="15" fill="#f0f4f8" stroke="#d4dfeb" stroke-width="2"/>
<text x="672" y="855" font-size="28" fill="#142b46" font-weight="600">Dataset Check</text>
<text x="672" y="895" font-size="24" fill="#43546b" font-weight="400">Inspect reconstruction</text>
<text x="672" y="929" font-size="24" fill="#43546b" font-weight="400">readiness</text>
<rect x="1050" y="470" width="240" height="165" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="1072" y="510" font-size="28" fill="#142b46" font-weight="600">Original dataset</text>
<text x="1072" y="550" font-size="24" fill="#43546b" font-weight="400">Original images</text>
<text x="1072" y="584" font-size="24" fill="#43546b" font-weight="400">+ camera model</text>
<text x="1072" y="618" font-size="24" fill="#43546b" font-weight="400">+ sparse points</text>
<path d="M1430 465 L1530 550 L1430 635 L1330 550 Z" fill="#eef6f4" stroke="#94b9ad" stroke-width="2"/>
<text x="1430" y="559" text-anchor="middle" font-size="25" fill="#142b46" font-weight="600">Undistort?</text>
<text x="1345" y="415" font-size="22" fill="#3877a6" font-weight="600">OPTIONAL STEP 1</text>
<text x="1545" y="525" font-size="23" fill="#43546b" font-weight="400">No</text>
<text x="1452" y="700" font-size="23" fill="#43546b" font-weight="400">Yes</text>
<rect x="1250" y="760" width="360" height="200" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="1272" y="800" font-size="28" fill="#142b46" font-weight="600">Undistort + overwrite</text>
<text x="1272" y="840" font-size="24" fill="#43546b" font-weight="400">Correct images and their</text>
<text x="1272" y="874" font-size="24" fill="#43546b" font-weight="400">camera calibration.</text>
<text x="1272" y="908" font-size="24" fill="#43546b" font-weight="400">Overwrite the original</text>
<text x="1272" y="942" font-size="24" fill="#43546b" font-weight="400">dataset with this pair.</text>
<rect x="1610" y="450" width="310" height="200" rx="15" fill="#e3f1eb" stroke="#a9cabc" stroke-width="2"/>
<text x="1632" y="490" font-size="28" fill="#142b46" font-weight="600">Active dataset</text>
<text x="1632" y="530" font-size="24" fill="#43546b" font-weight="400">Original OR undistorted</text>
<text x="1632" y="564" font-size="24" fill="#43546b" font-weight="400">images + matching</text>
<text x="1632" y="598" font-size="24" fill="#43546b" font-weight="400">camera model</text>
<text x="1632" y="632" font-size="24" fill="#43546b" font-weight="400">+ sparse points</text>
<path d="M2070 465 L2170 550 L2070 635 L1970 550 Z" fill="#eef6f4" stroke="#94b9ad" stroke-width="2"/>
<text x="2070" y="559" text-anchor="middle" font-size="25" fill="#142b46" font-weight="600">Align?</text>
<text x="1985" y="415" font-size="22" fill="#3877a6" font-weight="600">OPTIONAL STEP 2</text>
<text x="2245" y="525" font-size="23" fill="#43546b" font-weight="400">No</text>
<text x="2092" y="700" font-size="23" fill="#43546b" font-weight="400">Yes</text>
<rect x="1910" y="760" width="410" height="200" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="1932" y="800" font-size="28" fill="#142b46" font-weight="600">Align active dataset</text>
<text x="1932" y="840" font-size="24" fill="#43546b" font-weight="400">Export model → preview</text>
<text x="1932" y="874" font-size="24" fill="#43546b" font-weight="400">Move → rotate X / Y / Z → scale</text>
<text x="1932" y="908" font-size="24" fill="#43546b" font-weight="400">Apply transforms to cameras</text>
<text x="1932" y="942" font-size="24" fill="#43546b" font-weight="400">and sparse 3D points.</text>
<text x="1910" y="1000" font-size="23" fill="#3877a6" font-weight="400">Works with original or undistorted data.</text>
<rect x="2430" y="470" width="270" height="165" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="2452" y="510" font-size="28" fill="#142b46" font-weight="600">Brush Dataset</text>
<text x="2452" y="550" font-size="24" fill="#43546b" font-weight="400">Prepare paired</text>
<text x="2452" y="584" font-size="24" fill="#43546b" font-weight="400">images + camera</text>
<text x="2452" y="618" font-size="24" fill="#43546b" font-weight="400">model for training.</text>
<rect x="2760" y="450" width="350" height="205" rx="15" fill="#f2eef9" stroke="#d6c9e9" stroke-width="2"/>
<text x="2782" y="490" font-size="28" fill="#142b46" font-weight="600">Brush Train</text>
<text x="2782" y="530" font-size="24" fill="#43546b" font-weight="400">Learn Gaussian splats</text>
<text x="2782" y="564" font-size="24" fill="#43546b" font-weight="400">in the background.</text>
<text x="2782" y="598" font-size="24" fill="#43546b" font-weight="400">Export splat PLY files.</text>
<text x="2782" y="697" font-size="22" fill="#43546b" font-weight="400">Cancel retains exported checkpoints.</text>
<rect x="3250" y="470" width="480" height="165" rx="15" fill="#eaf2fa" stroke="#c1d7e9" stroke-width="2"/>
<text x="3272" y="510" font-size="28" fill="#142b46" font-weight="600">Splat Preview</text>
<text x="3272" y="550" font-size="24" fill="#43546b" font-weight="400">Coloured point-cloud preview</text>
<text x="3272" y="584" font-size="24" fill="#43546b" font-weight="400">in Rhino; preserves the</text>
<text x="3272" y="618" font-size="24" fill="#43546b" font-weight="400">PLY’s stored coordinates.</text>
<rect x="3250" y="745" width="480" height="165" rx="15" fill="#ffffff" stroke="#d4dfeb" stroke-width="2"/>
<text x="3272" y="785" font-size="28" fill="#142b46" font-weight="600">Optional visualization copy</text>
<text x="3272" y="825" font-size="24" fill="#43546b" font-weight="400">Rotate +90° around X.</text>
<text x="3272" y="859" font-size="24" fill="#43546b" font-weight="400">Write a separate _rgs.ply</text>
<text x="3272" y="893" font-size="24" fill="#43546b" font-weight="400">for RhinoGaussianSplatting.</text>
<path d="M60 1080 H3730" stroke="#d5dfe9" stroke-width="2"/>
<text x="60" y="1132" font-size="22" fill="#3877a6" font-weight="600">PAIRING RULE</text>
<text x="253" y="1132" font-size="25" fill="#43546b" font-weight="400">Keep images paired with their matching camera calibration.</text>
<text x="1910" y="1132" font-size="25" fill="#43546b" font-weight="400">Either dataset can continue with or without alignment.</text>
</g></svg>