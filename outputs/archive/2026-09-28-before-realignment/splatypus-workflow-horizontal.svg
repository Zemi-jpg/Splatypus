<rect x="60" y="470" width="240" height="165" rx="15" fill="#ffffff" stroke="#d4dfeb" stroke-width="2"/>
<text x="82" y="510" font-size="28" fill="#142b46" font-weight="600">Project setup</text>
<text x="82" y="550" font-size="24" fill="#43546b" font-weight="400">Create project</text>
<text x="82" y="584" font-size="24" fill="#43546b" font-weight="400">Locate / download</text>
<text x="82" y="618" font-size="24" fill="#43546b" font-weight="400">required tools</text>
<rect x="340" y="470" width="270" height="165" rx="15" fill="#ffffff" stroke="#d4dfeb" stroke-width="2"/>
<text x="362" y="510" font-size="28" fill="#142b46" font-weight="600">Media import</text>
<text x="362" y="550" font-size="24" fill="#43546b" font-weight="400">Photos or video</text>
<text x="362" y="584" font-size="24" fill="#43546b" font-weight="400">FFmpeg prepares</text>
<text x="362" y="618" font-size="24" fill="#43546b" font-weight="400">the image set</text>
<rect x="650" y="435" width="340" height="225" rx="15" fill="#eaf2fa" stroke="#c1d7e9" stroke-width="2"/>
<text x="672" y="475" font-size="28" fill="#142b46" font-weight="600">COLMAP</text>
<text x="672" y="515" font-size="24" fill="#43546b" font-weight="400">1. Extract features</text>
<text x="672" y="549" font-size="24" fill="#43546b" font-weight="400">2. Match across images</text>
<text x="672" y="583" font-size="24" fill="#43546b" font-weight="400">3. Reconstruct cameras</text>
<text x="672" y="617" font-size="24" fill="#43546b" font-weight="400">    and sparse 3D points</text>
<rect x="650" y="815" width="340" height="130" rx="15" fill="#f0f4f8" stroke="#d4dfeb" stroke-width="2"/>
<text x="672" y="855" font-size="28" fill="#142b46" font-weight="600">Dataset Check</text>
<text x="672" y="895" font-size="24" fill="#43546b" font-weight="400">Inspect reconstruction</text>
<text x="672" y="929" font-size="24" fill="#43546b" font-weight="400">readiness</text>
<rect x="1080" y="275" width="750" height="160" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="1102" y="315" font-size="28" fill="#142b46" font-weight="600">A · Original</text>
<text x="1102" y="355" font-size="24" fill="#43546b" font-weight="400">Original images + original camera model</text>
<text x="1102" y="389" font-size="24" fill="#43546b" font-weight="400">Keep Sparse and Undistorted inputs empty.</text>
<rect x="1080" y="470" width="750" height="160" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="1102" y="510" font-size="28" fill="#142b46" font-weight="600">B · Undistorted</text>
<text x="1102" y="550" font-size="24" fill="#43546b" font-weight="400">Correct images and camera calibration together.</text>
<text x="1102" y="584" font-size="24" fill="#43546b" font-weight="400">Dense output → Undistorted input; leave Sparse empty.</text>
<text x="1080" y="694" font-size="28" fill="#142b46" font-weight="600">C · Aligned</text>
<rect x="1080" y="720" width="215" height="145" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="1102" y="760" font-size="28" fill="#142b46" font-weight="600">Export model</text>
<text x="1102" y="800" font-size="24" fill="#43546b" font-weight="400">Readable text</text>
<text x="1102" y="834" font-size="24" fill="#43546b" font-weight="400">model</text>
<rect x="1330" y="720" width="255" height="175" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="1352" y="760" font-size="28" fill="#142b46" font-weight="600">Preview + move</text>
<text x="1352" y="800" font-size="24" fill="#43546b" font-weight="400">Cloud + cameras</text>
<text x="1352" y="834" font-size="24" fill="#43546b" font-weight="400">Move → rotate</text>
<text x="1352" y="868" font-size="24" fill="#43546b" font-weight="400">X / Y / Z → scale</text>
<rect x="1620" y="720" width="210" height="175" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="1642" y="760" font-size="28" fill="#142b46" font-weight="600">Align model</text>
<text x="1642" y="800" font-size="24" fill="#43546b" font-weight="400">Apply transforms</text>
<text x="1642" y="834" font-size="24" fill="#43546b" font-weight="400">to camera poses</text>
<text x="1642" y="868" font-size="24" fill="#43546b" font-weight="400">and 3D points</text>
<path d="M1295 785 H1330" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M1585 785 H1620" fill="none" stroke="#7a8ca1" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M1187 865 V923 H1725 V895" fill="none" stroke="#7a8ca1" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text x="1332" y="956" font-size="22" fill="#43546b" font-weight="400">Source text model also feeds alignment</text>
<text x="1535" y="693" font-size="22" fill="#43546b" font-weight="400">Original images + aligned Sparse</text>
<rect x="1920" y="470" width="210" height="165" rx="15" fill="#eef6f4" stroke="#bfd9d0" stroke-width="2"/>
<text x="1942" y="510" font-size="28" fill="#142b46" font-weight="600">Brush Dataset</text>
<text x="1942" y="550" font-size="24" fill="#43546b" font-weight="400">Prepare paired</text>
<text x="1942" y="584" font-size="24" fill="#43546b" font-weight="400">images + camera</text>
<text x="1942" y="618" font-size="24" fill="#43546b" font-weight="400">model</text>
<rect x="2180" y="450" width="350" height="205" rx="15" fill="#f2eef9" stroke="#d6c9e9" stroke-width="2"/>
<text x="2202" y="490" font-size="28" fill="#142b46" font-weight="600">Brush Train</text>
<text x="2202" y="530" font-size="24" fill="#43546b" font-weight="400">Learn Gaussian splats</text>
<text x="2202" y="564" font-size="24" fill="#43546b" font-weight="400">in the background.</text>
<text x="2202" y="598" font-size="24" fill="#43546b" font-weight="400">Export splat PLY files.</text>
<text x="2202" y="697" font-size="22" fill="#43546b" font-weight="400">Cancel retains exported checkpoints.</text>
<rect x="2700" y="470" width="430" height="165" rx="15" fill="#eaf2fa" stroke="#c1d7e9" stroke-width="2"/>
<text x="2722" y="510" font-size="28" fill="#142b46" font-weight="600">Splat Preview</text>
<text x="2722" y="550" font-size="24" fill="#43546b" font-weight="400">Coloured point-cloud preview</text>
<text x="2722" y="584" font-size="24" fill="#43546b" font-weight="400">in Rhino; preserves the</text>
<text x="2722" y="618" font-size="24" fill="#43546b" font-weight="400">PLY’s stored coordinates.</text>
<rect x="2700" y="745" width="430" height="165" rx="15" fill="#ffffff" stroke="#d4dfeb" stroke-width="2"/>
<text x="2722" y="785" font-size="28" fill="#142b46" font-weight="600">Optional visualization copy</text>
<text x="2722" y="825" font-size="24" fill="#43546b" font-weight="400">Rotate +90° around X.</text>
<text x="2722" y="859" font-size="24" fill="#43546b" font-weight="400">Write a separate _rgs.ply</text>
<text x="2722" y="893" font-size="24" fill="#43546b" font-weight="400">for RhinoGaussianSplatting.</text>
<path d="M60 1004 H3130" stroke="#d5dfe9" stroke-width="2"/>
<text x="60" y="1050" font-size="22" fill="#3877a6" font-weight="600">PAIRING RULE</text>
<text x="253" y="1050" font-size="25" fill="#43546b" font-weight="400">Do not combine Undistorted with an aligned Sparse override.</text>
<text x="1680" y="1050" font-size="25" fill="#43546b" font-weight="400">Arrows show dependencies; Run / Prepare / Write start each step.</text>
</g></svg>