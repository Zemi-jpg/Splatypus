<text x="340" y="201" font-size="24" fill="#3877a6" font-weight="600">02</text>
<text x="383" y="201" font-size="28" fill="#263e59" font-weight="600">Images</text>
<path d="M340 220 H610" stroke="#d5dfe9" stroke-width="2"/>
<text x="650" y="201" font-size="24" fill="#3877a6" font-weight="600">03</text>
<text x="693" y="201" font-size="28" fill="#263e59" font-weight="600">Reconstruct</text>
<path d="M650 220 H990" stroke="#d5dfe9" stroke-width="2"/>
<text x="1080" y="201" font-size="24" fill="#3877a6" font-weight="600">04</text>
<text x="1123" y="201" font-size="28" fill="#263e59" font-weight="600">Choose a dataset route</text>
<path d="M1080 220 H2130" stroke="#d5dfe9" stroke-width="2"/>
<text x="2180" y="201" font-size="24" fill="#3877a6" font-weight="600">05</text>
<text x="2223" y="201" font-size="28" fill="#263e59" font-weight="600">Train</text>
<path d="M2180 220 H2530" stroke="#d5dfe9" stroke-width="2"/>
<text x="2700" y="201" font-size="24" fill="#3877a6" font-weight="600">06</text>
<text x="2743" y="201" font-size="28" fill="#263e59" font-weight="600">Preview</text>
<path d="M2700 220 H3130" stroke="#d5dfe9" stroke-width="2"/>
